name: Build

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v3

      - name: Extract version from config.h
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk '/^#define[[:space:]]+VERSION[[:space:]]+/ {print $3}' config.h)
          VERSION="${VERSION%\"}"
          VERSION="${VERSION#\"}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  buildlinux:
    name: Linux x64
    runs-on: ubuntu-22.04
    needs: version

    steps:
      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-randr0 \
            libxkbcommon-x11-0 \
            libfuse2

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v3

      - name: Clone
        uses: actions/checkout@v3

      - name: Compile
        run: |
          qmake CONFIG+=release PREFIX=/usr SavvyCAN.pro
          make -j"$(grep -c ^processor /proc/cpuinfo)"

      - name: Package
        run: |
          make INSTALL_ROOT=appdir install
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage appdir/usr/share/applications/SavvyCAN.desktop -appimage -extra-plugins=iconengines,platformthemes/libqgtk3.so,canbus
          mv SavvyCAN-*x86_64.AppImage SavvyCAN-${{ needs.version.outputs.version }}-Linux_x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-${{ needs.version.outputs.version }}-Linux_x64
          path: SavvyCAN-${{ needs.version.outputs.version }}-Linux_x64.AppImage

  buildmacos86:
    name: macOS x64
    runs-on: macos-15-intel
    needs: version

    steps:
      - name: Prepare macOS Environment
        run: |
          brew install qt@5
          brew link qt@5 --force

      - name: Clone
        uses: actions/checkout@v3

      - name: Compile
        run: |
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyCAN.pro
          make -j"$(sysctl -n hw.ncpu)"
          lrelease translations/*.ts

      - name: Package
        run: |
          mkdir -p SavvyCAN.app/Contents/MacOS/translations
          mkdir -p SavvyCAN.app/Contents/MacOS/help
          cp -R translations/*.qm SavvyCAN.app/Contents/MacOS/translations
          cp -R help/* SavvyCAN.app/Contents/MacOS/help
          macdeployqt SavvyCAN.app -dmg
          mv SavvyCAN.dmg SavvyCAN-${{ needs.version.outputs.version }}-macOS_x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-${{ needs.version.outputs.version }}-macOS_x64
          path: SavvyCAN-${{ needs.version.outputs.version }}-macOS_x64.dmg

  buildmacos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    needs: version

    steps:
      - name: Prepare macOS Environment
        run: |
          brew install qt@5
          brew link qt@5 --force

      - name: Clone
        uses: actions/checkout@v3

      - name: Compile
        run: |
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyCAN.pro
          make -j"$(sysctl -n hw.ncpu)"
          lrelease translations/*.ts

      - name: Package
        run: |
          mkdir -p SavvyCAN.app/Contents/MacOS/translations
          mkdir -p SavvyCAN.app/Contents/MacOS/help
          cp -R translations/*.qm SavvyCAN.app/Contents/MacOS/translations
          cp -R help/* SavvyCAN.app/Contents/MacOS/help
          macdeployqt SavvyCAN.app -dmg
          mv SavvyCAN.dmg SavvyCAN-${{ needs.version.outputs.version }}-macOS_ARM64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-${{ needs.version.outputs.version }}-macOS_ARM64
          path: SavvyCAN-${{ needs.version.outputs.version }}-macOS_ARM64.dmg

  buildwindows:
    name: Windows x64
    runs-on: windows-2022
    needs: version

    steps:
      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v3

      - name: Clone
        uses: actions/checkout@v3

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake CONFIG+=release SavvyCAN.pro
          nmake /C

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "release/SavvyCAN.exe" "package/"
          Copy-Item "translations" "package/translations" -Recurse
          Copy-Item "help" "package/help" -Recurse
          Copy-Item "examples" "package/examples" -Recurse
          & "${Env:Qt5_Dir}\bin\windeployqt.exe" --release --dir package "package/SavvyCAN.exe"

      - name: Zip package
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath SavvyCAN-${{ needs.version.outputs.version }}-Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-${{ needs.version.outputs.version }}-Windows_x64
          path: SavvyCAN-${{ needs.version.outputs.version }}-Windows_x64.zip

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [version, buildwindows, buildmacos86, buildmacos-arm64, buildlinux]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Show downloaded files
        run: find . -maxdepth 3 -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SavvyCAN v${{ needs.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            SavvyCAN-${{ needs.version.outputs.version }}-Linux_x64/SavvyCAN-${{ needs.version.outputs.version }}-Linux_x64.AppImage
            SavvyCAN-${{ needs.version.outputs.version }}-Windows_x64/SavvyCAN-${{ needs.version.outputs.version }}-Windows_x64.zip
            SavvyCAN-${{ needs.version.outputs.version }}-macOS_x64/SavvyCAN-${{ needs.version.outputs.version }}-macOS_x64.dmg
            SavvyCAN-${{ needs.version.outputs.version }}-macOS_ARM64/SavvyCAN-${{ needs.version.outputs.version }}-macOS_ARM64.dmg
